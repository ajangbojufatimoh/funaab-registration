<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

</head>

<body>

    <header>

        <h1>Student Registration Form</h1>

        <p>Please complete the form below to register.</p>

    </header>

    <main>

        <section aria-labelledby="registration-heading">

            <h2 id="registration-heading">Student Information</h2>

            <form action="#" method="post">

                <div>

                    <label for="name">Full Name:</label>

                    <input type="text" id="name" name="name"

                           placeholder="Enter your full name" required>

                </div>

                <br>

                <div>

                    <label for="matric">Matric Number:</label>

                    <input type="text" id="matric" name="matric"

                           placeholder="Enter your matric number" required>

                </div>

                <br>

                <div>

                    <label for="department">Department:</label>

                    <select id="department" name="department" required>

                        <option value="">Select Department</option>

                        <option value="computer-science">Computer Science</option>

                        <option value="cyber-security">Cyber Security</option>

                        <option value="information-technology">Information Technology</option>

                        <option value="information communication technology ">Information Communication Technology</option>

                        <option value="information-systems">Information Systems</option>

                        <option value="data-science">Data Science</option>

                        <option value="computer-engineering">Computer Engineering</option>

                    </select>

                </div>

                <br>

                <div>

                    <label for="email">Email Address:</label>

                    <input type="email" id="email" name="email"

                           placeholder="Enter your email" required>

                </div>

                <br>

                <div>

                    <label for="gender">Gender:</label>

                    <select id="gender" name="gender" required>

                        <option value="">Select Gender</option>

                        <option value="male">Male</option>

                        <option value="female">Female</option>

                        <option value="prefer-not-to-say">Prefer not to say</option>

                    </select>

                </div>

                <br>

                <div>

                    <label for="phone">Phone Number:</label>

                    <input type="tel" id="phone" name="phone"

                           placeholder="Enter your phone number"

                           autocomplete="tel" required>

                </div>

                <br>

                <fieldset>

                    <legend>Program</legend>

                    <label for="full">Full Time</label>

                    <input type="radio" id="full" name="program"

                           value="full-time" required>

                    <label for="weekday">Weekday</label>

                    <input type="radio" id="weekday" name="program"

                           value="weekday">

                    <label for="weekends">Weekends</label>

                    <input type="radio" id="weekends" name="program"

                           value="weekends">

                </fieldset>

                <br>

                <button type="submit">Register</button>

                <button type="reset">Clear Form</button>

            </form>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 Student Registration Page</p>

    </footer>

</body>

</html>
